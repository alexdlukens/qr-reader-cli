id: com.alukens.qr-cli
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
command: qr-cli
modules:
  - name: qr-cli
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --no-index --find-links="file://${PWD}/vendor" --prefix=${FLATPAK_DEST} uv-build
      - pip3 install --verbose --no-index --find-links="file://${PWD}/vendor" --prefix=${FLATPAK_DEST} -r requirements.txt
      - pip3 install --verbose --no-index --find-links="file://${PWD}/vendor" --prefix=${FLATPAK_DEST} --no-build-isolation .
    sources:
      - type: dir
        path: vendor
        dest: vendor
      - type: git
        url: https://github.com/alexdlukens/qr-reader-cli.git
        commit: 7bd3edd04409d77a60554ab1e1e98fdfffecc298
finish-args:
  - --filesystem=home:ro
  - --device=all
