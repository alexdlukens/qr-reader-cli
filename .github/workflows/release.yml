name: Release

# Manual: Actions -> Release -> Run workflow, enter the version (no leading "v").
# Bumps the version in pyproject.toml (the snap adopts it) plus uv.lock, commits
# to the default branch, tags that commit, publishes the GitHub release, then
# builds the wheel and calls snap.yml to attach both to that release.
#
# The snap build is called as a reusable workflow rather than triggered by
# `on: release` because events created with GITHUB_TOKEN (this push, this
# release) never start new workflow runs.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, MAJOR.MINOR.PATCH, no leading v"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Validate version
        id: check
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi
          current=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          if [[ "$current" == "$VERSION" ]]; then
            echo "::error::pyproject.toml is already at $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v6

      - name: Bump version
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          uv version --no-sync "$VERSION"
          uv lock

      - name: Commit version bump
        env:
          VERSION: ${{ steps.check.outputs.version }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "release v$VERSION"
          git push origin "HEAD:$BRANCH"

      - name: Tag and publish release
        env:
          VERSION: ${{ steps.check.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes --verify-tag

  wheel:
    needs: release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      - uses: astral-sh/setup-uv@v6

      - name: Build wheel
        run: uv build --wheel --out-dir dist

      - name: Verify wheel version
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          expected="qr_reader_cli-${VERSION}-py3-none-any.whl"
          wheels=(dist/*.whl)
          if [[ ${#wheels[@]} -ne 1 || "$(basename "${wheels[0]}")" != "$expected" ]]; then
            echo "::error::built ${wheels[*]}, expected dist/$expected"
            exit 1
          fi

      - name: Attach wheel to release
        env:
          VERSION: ${{ needs.release.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$VERSION" dist/*.whl --clobber

  snap:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/snap.yml
    with:
      version: ${{ needs.release.outputs.version }}
