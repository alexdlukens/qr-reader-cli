
[project]

name = "qr-reader-cli"
version = "0.1.0"
description = "A QR Code reader on the command line."
authors = [{ name = "Alex Lukens", email = "alexdlukens@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"

dependencies = [
    "opencv-python-headless",
    "rich",
    "rich-pixels",
    "questionary",
    "opencv-contrib-python-headless",
]

[project.scripts]
qr-cli = "qr_reader_cli.main:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.3.5,<9.0.0", "ruff>=0.11.11,<1.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
